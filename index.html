      font-size: 18px;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin-bottom: 14px;
    }

      margin-top: 15px;
    }

      border-top: none;
      padding-top: 0;
      margin-top: 0;
    }

      color: white;
      font-size: 12px;
      font-weight: 800;
      padding: 6px 12px;
      border-radius: 999px;
      margin-bottom: 8px;
      letter-spacing: 0.04em;
    }

    .label.next {

      color: #d8deea;
      border: 1px solid rgba(255,255,255,0.15);

      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      margin-top: 8px;
      box-shadow: 0 14px 30px rgba(0, 120, 255, 0.35);

    function formatDate(date) {
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, "0");
      const day = String(date.getDate()).padStart(2, "0");

      return `${year}-${month}-${day}`;
    }

    function isHoliday(date) {
      return HOLIDAYS_2026.includes(formatDate(date));
    }

    function getDayType(date) {
      const day = date.getDay();

      if (isHoliday(date) || day === 0) {
        return "holiday";
      }

      if (day === 6) {
        return "saturday";
      }

      return "weekday";
    }

    function getDayTypeText(dayType) {
      if (dayType === "weekday") return "平日ダイヤ";
      if (dayType === "saturday") return "土曜ダイヤ";
      if (dayType === "holiday") return "日曜・祝日ダイヤ";
      return "不明";
    }

    function toMinutes(timeText) {
      const [hour, minute] = timeText.split(":").map(Number);
      return hour * 60 + minute;
    }

    function toTimeText(minutes) {
      const hour = Math.floor(minutes / 60) % 24;
      const minute = minutes % 60;

      return String(hour).padStart(2, "0") + ":" + String(minute).padStart(2, "0");
    }

    function nowMinutes() {
      const now = new Date();
      return now.getHours() * 60 + now.getMinutes();
    }

    function normalizeTrain(train) {
      let dep = toMinutes(train.dep);
      let arr = toMinutes(train.arr);

      if (arr < dep) {
        arr += 24 * 60;
      }

      return {
        dep,
        arr,
        depText: train.dep,
        arrText: train.arr
      };
    }

    function findSecondTrain(secondTrains, afterMinutes) {
      for (const rawTrain of secondTrains) {
        const train = normalizeTrain(rawTrain);

        if (train.dep >= afterMinutes) {
          return train;
        }
      }

      return null;
    }

    function findBestConnections(firstTrains, secondTrains, startMinutes) {
      const candidates = [];

      for (const rawFirstTrain of firstTrains) {
        const firstTrain = normalizeTrain(rawFirstTrain);

        if (firstTrain.dep < startMinutes) {
          continue;
        }

        const transferReadyTime = firstTrain.arr + WALK_MINUTES;
        const secondTrain = findSecondTrain(secondTrains, transferReadyTime);

        if (!secondTrain) {
          continue;
        }

        candidates.push({
          firstTrain,
          secondTrain,
          totalMinutes: secondTrain.arr - startMinutes,
          arrivalMinutes: secondTrain.arr
        });
      }

      candidates.sort((a, b) => {
        if (a.arrivalMinutes !== b.arrivalMinutes) {
          return a.arrivalMinutes - b.arrivalMinutes;
        }

        return a.firstTrain.dep - b.firstTrain.dep;
      });

      return candidates.slice(0, 2);
    }

    function renderOption(candidate, index, labels) {
      const labelText = index === 0 ? "最短" : "次の候補";
      const labelClass = index === 0 ? "label" : "label next";

      return `
        <div class="option">
          <div class="${labelClass}">${labelText}</div>
          <div class="big-time">${candidate.totalMinutes}分</div>
          <div class="arrival">${toTimeText(candidate.arrivalMinutes)}着</div>

          <div class="detail">
            ${labels.firstLabel}：
            ${candidate.firstTrain.depText} → ${candidate.firstTrain.arrText}<br>

            乗換：
            ${labels.transferLabel} 徒歩 ${WALK_MINUTES}分<br>

            ${labels.secondLabel}：
            ${candidate.secondTrain.depText} → ${candidate.secondTrain.arrText}
          </div>
        </div>
      `;
    }

    function calculateRoute({
      firstTrains,
      secondTrains,
      firstLabel,
      secondLabel,
      transferLabel,
      outputId
    }) {
      const start = nowMinutes();
      const candidates = findBestConnections(firstTrains, secondTrains, start);
      const output = document.getElementById(outputId);

      if (candidates.length === 0) {
        output.innerHTML = `<span class="error">今日のこの方向の乗れる候補がもうありません。</span>`;
        return;
      }

      output.innerHTML = candidates.map((candidate, index) => {
        return renderOption(candidate, index, {
          firstLabel,
          secondLabel,
          transferLabel
        });
      }).join("");
    }

    function calculateAll() {
      const today = new Date();
      const dayType = getDayType(today);
      const data = timetable[dayType];
      const current = nowMinutes();

      document.getElementById("status").textContent =
        `${formatDate(today)} / ${getDayTypeText(dayType)} / 現在 ${toTimeText(current)}`;

      calculateRoute({
        firstTrains: data.ozoneToShinSeto,
        secondTrains: data.setoshiToYakusa,
        firstLabel: "大曽根 → 新瀬戸",
        secondLabel: "瀬戸市 → 八草",
        transferLabel: "新瀬戸 → 瀬戸市",
        outputId: "go-options"
      });

      calculateRoute({
        firstTrains: data.yakusaToSetoshi,
        secondTrains: data.shinSetoToOzone,
        firstLabel: "八草 → 瀬戸市",
        secondLabel: "新瀬戸 → 大曽根",
        transferLabel: "瀬戸市 → 新瀬戸",
        outputId: "back-options"
      });
    }
